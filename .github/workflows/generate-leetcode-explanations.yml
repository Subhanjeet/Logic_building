name: Generate LeetCode Explanations

on:
  push:
    branches: [main]
    paths:
      - "**/*.java"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  generate-explanations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate LeetCode README files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p 'Work only on the LeetCode-style problem folders at the repository root.

          IMPORTANT SCOPE:
          - Include only root-level folders whose name starts with a LeetCode problem number and that contain a Java solution file.
          - Include folders such as "1-Two-Sum", "739-daily-temperatures", "56-merge-intervals", etc.
          - Do NOT touch anything inside JAVA/.
          - Do NOT touch anything inside PYTHON/.
          - Do NOT touch "Max Sum Subarray of size K".
          - Do NOT modify the root README.md.
          - Do NOT modify any .java source file.
          - Only create or replace README.md inside the individual LeetCode problem folders.

          TASK:
          For EVERY included LeetCode problem folder, inspect the actual Java solution and create/update that folder's README.md.

          The README.md must follow exactly this structure:

          # <problem number>. <problem title>

          **LeetCode:** [<problem title>](https://leetcode.com/problems/<title-slug>/)

          **Difficulty:** 🟢 Easy / 🟡 Medium / 🔴 Hard

          ## Code

          Copy the exact Java solution currently present in the folder. Do not change the code.

          ## Code Explanation

          Explain the code line by line in very simple language, like a beginner-friendly ChatGPT explanation. For every meaningful line or small group of directly related lines:
          - show the code line in inline code
          - explain exactly what it does
          - explain why it is needed
          - do not invent behavior that the code does not perform

          ## Logic

          Explain the main idea/pattern in simple words before the dry run.

          ## Dry Run

          Give one short, concrete dry run using a small example. Show the important variable changes step by step.

          ## Time Complexity

          State the Big-O time complexity and explain why.

          ## Space Complexity

          State the Big-O space complexity and explain why.

          RULES:
          - Base everything on the actual Java code in the folder.
          - Keep the explanation simple and direct.
          - Do not add "next problems", recommendations, roadmaps, or unrelated theory.
          - Do not add extra sections.
          - If the folder already has a README.md, replace its old explanation with this format.
          - If duplicate folders contain the same LeetCode problem, still create/update README.md in BOTH folders because both contain actual code.
          - Preserve the exact source code.
          - Work through all matching folders, not just the folder changed in the latest commit.
          - Do not commit or push anything yourself; the workflow will do that after this command.'             --model=gpt-5.4             --allow-tool='write(README.md)'             --available-tools='view,glob,grep,create,edit'             --no-ask-user

      - name: Commit generated explanations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md '*/README.md'; then
            echo "No explanation changes."
            exit 0
          fi

          git add -- '*/README.md'
          git commit -m "docs: add LeetCode code explanations"
          git push
